# ============================================================================
# AuthentiLens — Docker Compose Orchestration
# ============================================================================
# Two-service microservices architecture:
#   - backend:  FastAPI + PyTorch ML inference engine  (port 8000)
#   - frontend: Streamlit interactive web UI           (port 8501)
#
# Run from the repo root:  docker compose up --build
# Weights are mounted read-only from ./checkpoints (see "Get the weights" in the README).
# Without checkpoints/segmentation/deeplabv3plus/best_model.pth the backend
# runs in classification-only mode.
# ============================================================================


services:
  # --------------------------------------------------------------------------
  # Backend: FastAPI server with PyTorch inference pipeline
  # --------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    container_name: authentilens_backend
    ports:
      - "8000:8000"
    networks:
      - authentilens_net
    volumes:
      - ./checkpoints:/app/checkpoints:ro
    environment:
      - PYTHONUNBUFFERED=1
      - AUTHENTILENS_CHECKPOINT_DIR=/app/checkpoints
      # Optional overrides (defaults shown):
      # - AUTHENTILENS_CLASSIFIER_CKPT=/app/checkpoints/classification/efficientnet_b0_balanced_lr2.5e-5/best_model.pth
      # - AUTHENTILENS_SEGMENTER_CKPT=/app/checkpoints/segmentation/deeplabv3plus/best_model.pth
      # - AUTHENTILENS_PIXEL_THRESHOLD=0.7
      # - AUTHENTILENS_OVERRIDE_PCT=30
    # Healthcheck to confirm the API is responsive before frontend connects
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # --------------------------------------------------------------------------
  # Frontend: Streamlit web UI for image upload and visualization
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: authentilens_frontend
    ports:
      - "8501:8501"
    networks:
      - authentilens_net
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_started

networks:
  authentilens_net:
    driver: bridge
