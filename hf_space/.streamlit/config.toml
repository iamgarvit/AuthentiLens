# Port must match app_port in README.md and EXPOSE/CMD in the Dockerfile.
[server]
port = 7860
address = "0.0.0.0"
headless = true
# enableCORS is left at its default: setting it to false conflicts with
# enableXsrfProtection, which Streamlit keeps on for a publicly reachable app.
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[theme]
base = "light"
